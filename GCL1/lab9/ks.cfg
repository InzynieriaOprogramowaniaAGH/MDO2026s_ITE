text
reboot
url --url="https://dl.fedoraproject.org/pub/fedora/linux/development/rawhide/Everything/x86_64/os/"
keyboard --vckeymap=pl
lang pl_PL.UTF-8
timezone Europe/Warsaw

network --bootproto=static --ip=192.168.10.2 --netmask=255.255.255.0 --device=enp0s3 --activate
network --bootproto=dhcp --device=enp0s8 --activate --hostname=fedora-hiredis-target

rootpw --plaintext admin123
user --name=piotrd --password=admin123 --plaintext

zerombr
clearpart --all --initlabel
autopart --type=plain

%packages
@core
wget
gcc
make
hiredis-devel
redis
%end

%post --log=/root/ks-post.log
SERVER_IP="192.168.10.1"
mkdir -p /opt/app
cd /opt/app
wget http://$SERVER_IP/hiredis-v1.0-b7-PD420765.tar.gz
wget http://$SERVER_IP/sample.c
tar -xf hiredis-v1.0-b7-PD420765.tar.gz
gcc sample.c -o /usr/local/bin/hiredis_app -lhiredis

ln -s /usr/lib64/libhiredis.so.1.1.0 /usr/lib64/libhiredis.so.1 || true

cat <<UNIT > /etc/systemd/system/hiredis.service
[Unit]
Description=Hiredis Application Service
After=redis.target

[Service]
ExecStart=/usr/local/bin/hiredis_app
Restart=always

[Install]
WantedBy=multi-user.target
UNIT

echo "127.0.0.1 redis-server" >> /etc/hosts
systemctl enable redis
systemctl enable hiredis.service
%end
