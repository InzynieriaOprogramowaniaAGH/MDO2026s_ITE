name: Hiredis Build and Quality 🌵

on:
  push:
    branches:
      - ino_dev
  workflow_dispatch:

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install static analysis tools
        run: sudo apt-get install -y cppcheck

      - name: Run Static Analysis (Code Quality)
        run: cppcheck --enable=all --error-exitcode=1 . 2>&1 | tee cppcheck_report.txt
        continue-on-error: true

      - name: Build Hiredis
        run: make

      - name: Run tests
        run: |
          make hiredis-test || echo "Tests failed but continuing..."

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hiredis-compiled-library
          path: |
            libhiredis.so
            libhiredis.a
            hiredis_ssl.so
          retention-days: 5
