apiVersion: apps/v1
kind: Deployment
metadata:
  name: aplikacja-stabilna
spec:
  replicas: 3
  selector:
    matchLabels:
      app: canary-demo
      track: stable
  template:
    metadata:
      labels:
        app: canary-demo
        track: stable
    spec:
      containers:
      - name: nginx-kontener
        image: moj-nginx:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 80