# Generated by Anaconda 43.44
# Keyboard layouts
keyboard --vckeymap=pl --xlayouts='pl'
# System language
lang pl_PL.UTF-8

# Installation source
cdrom

# Additional Fedora repositories
repo --name=fedora-online --mirrorlist="https://mirrors.fedoraproject.org/mirrorlist?repo=fedora-43&arch=x86_64"
repo --name=updates-online --mirrorlist="https://mirrors.fedoraproject.org/mirrorlist?repo=updates-released-f43&arch=x86_64"

# Network information
network  --bootproto=dhcp --device=eth0 --ipv6=auto --activate
network  --hostname=fedora
firewall --enabled --service=ssh --port=3000:tcp

%packages
@^server-product-environment
@domain-client
@guest-agents
@server-hardware-support
nodejs
nodejs-npm
python3

%end

# System authorization information
authselect enable-feature with-fingerprint

# Run the Setup Agent on first boot
firstboot --disable

# Generated using Blivet version 3.12.1
ignoredisk --only-use=sda
autopart
# Partition clearing information
clearpart --all --initlabel

# System timezone
timezone Europe/Warsaw --utc

#Root password
rootpw --lock
user --groups=wheel --name=daniel --password=$y$j9T$mueJBIgN5SD7r7kOcy9eU9WL$HIYidHqV01au9y5pQXjNb1W49mhH7ncJNRJMreU/xb8 --iscrypted --gecos="daniel"

%post --erroronfail --log=/root/ks-post.log
mkdir -p /opt/axios-app
cd /opt/axios-app
python3 -c "import urllib.request; urllib.request.urlretrieve('http://172.22.199.112:8000/axios-1.20.0.tgz', 'axios-1.20.0.tgz')"
npm init -y
npm install ./axios-1.20.0.tgz
cat > /opt/axios-app/app.mjs <<'EOF_APP'
import http from 'node:http';
import axios from 'axios';

const server = http.createServer((req, res) => {
  res.writeHead(200, {'Content-Type': 'text/plain; charset=utf-8'});
  res.end(`Axios ${axios.VERSION} działa na Fedora Lab09\n`);
});

server.listen(3000, '0.0.0.0', () => {
  console.log(`Axios ${axios.VERSION} service listening on port 3000`);
});
EOF_APP
cat > /etc/systemd/system/axios-app.service <<'EOF_SERVICE'
[Unit]
Description=Axios Lab09 service
After=network-online.target
Wants=network-online.target

[Service]
Type=simple
WorkingDirectory=/opt/axios-app
ExecStart=/usr/bin/node /opt/axios-app/app.mjs
Restart=on-failure

[Install]
WantedBy=multi-user.target
EOF_SERVICE

systemctl enable axios-app.service


%end

# Reboot after installation
reboot
