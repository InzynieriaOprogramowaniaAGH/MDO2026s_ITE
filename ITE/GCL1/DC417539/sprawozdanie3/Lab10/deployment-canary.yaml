apiVersion: apps/v1
kind: Deployment

metadata:
  name: lab10-nginx-stable

spec:
  replicas: 3

  selector:
    matchLabels:
      app: lab10-nginx-canary
      version: stable

  template:
    metadata:
      labels:
        app: lab10-nginx-canary
        version: stable

    spec:
      containers:
        - name: lab10-nginx
          image: lab10-nginx:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80

---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: lab10-nginx-canary

spec:
  replicas: 1

  selector:
    matchLabels:
      app: lab10-nginx-canary
      version: canary

  template:
    metadata:
      labels:
        app: lab10-nginx-canary
        version: canary

    spec:
      containers:
        - name: lab10-nginx
          image: lab10-nginx:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service

metadata:
  name: lab10-nginx-canary

spec:
  selector:
    app: lab10-nginx-canary

  ports:
    - port: 80
      targetPort: 80

  type: ClusterIP
