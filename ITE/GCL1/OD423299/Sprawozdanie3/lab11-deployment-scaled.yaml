apiVersion: apps/v1
kind: Deployment
metadata:
  name: oskar-massive-web
  labels:
    app: oskar-web
spec:
  replicas: 5
  selector:
    matchLabels:
      app: oskar-web
  template:
    metadata:
      labels:
        app: oskar-web
    spec:
      containers:
      - name: nginx-container
        image: oskar-nginx:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8888