reboot
eula --agreed

url --mirrorlist=http://mirrors.fedoraproject.org/mirrorlist?repo=fedora-44&arch=x86_64
repo --name=update --mirrorlist=http://mirrors.fedoraproject.org/mirrorlist?repo=updates-released-f44&arch=x86_64

keyboard --vckeymap=pl --xlayouts='pl'
lang pl_PL.UTF-8
timezone Europe/Warsaw

network --bootproto=dhcp --device=link --activate --hostname=fedora-autodeploy

rootpw --plaintext haslo123
user --name=student --password=haslo123 --plaintext --groups=wheel

zerombr
clearpart --all --initlabel
autopart

%packages
@core
moby-engine
docker-compose
wget
tar
%end

%post --log=/root/ks-post.log
systemctl enable docker

cat << 'EOF' > /etc/systemd/system/uruchom-fmt.service
[Unit]
Description=Pobranie i uruchomienie kontenera FMT
After=network-online.target docker.service
Wants=network-online.target
Requires=docker.service

[Service]
Type=oneshot
ExecStartPre=/usr/bin/wget -O /tmp/fmt-artifact.tar.gz http://172.27.207.81:8000/fmt-artifact.tar.gz
ExecStart=/usr/bin/docker run -d --name fmt-app -v /tmp/fmt-artifact.tar.gz:/app/fmt-artifact.tar.gz ubuntu sleep 3600
RemainAfterExit=yes

[Install]
WantedBy=multi-user.target
EOF

systemctl enable uruchom-fmt.service
%end
