#version=F44
url --mirrorlist=https://mirrors.fedoraproject.org/mirrorlist?repo=fedora-44&arch=aarch64
repo --name=updates --mirrorlist=https://mirrors.fedoraproject.org/mirrorlist?repo=updates-released-f44&arch=aarch64

text
lang en_US.UTF-8
keyboard us
timezone Europe/Warsaw --utc
network --bootproto=dhcp --device=link --activate --hostname=lab09-fedora

rootpw --iscrypted $6$A3eR2jqZl6gOCuka$gelVgewdcLNZJ6Mdhk4cgE124dfvBpMO2WOmWPY1/cm.AwGHEiDwF6z/dqs.xEdto./4GAbh5x57K600ldBZh0

firewall --enabled --service=ssh
selinux --enforcing
services --enabled="sshd,chronyd"

zerombr
clearpart --all --initlabel
autopart

reboot

%packages
@^minimal-environment
openssh-server
sudo
curl
wget
git
dnf-plugins-core
%end

%post --log=/root/ks-post.log --erroronfail
exec > /dev/tty3 2>&1
echo "=== ks %post start ==="

dnf -y install dnf-plugins-core
dnf config-manager --add-repo https://download.docker.com/linux/fedora/docker-ce.repo
dnf -y install docker-ce docker-ce-cli containerd.io
systemctl enable docker

cat >/usr/local/bin/run-app.sh <<'SCRIPT'
#!/usr/bin/env bash
set -euo pipefail
docker rm -f nest-app || true
docker pull mateuszdoktor1/nest-app:3
docker run -d --name nest-app -p 3000:3000 --restart=always mateuszdoktor1/nest-app:3
SCRIPT
chmod +x /usr/local/bin/run-app.sh

cat >/etc/systemd/system/nest-app.service <<'UNIT'
[Unit]
Description=Run Nest app container
After=network-online.target docker.service
Requires=docker.service

[Service]
Type=oneshot
RemainAfterExit=yes
ExecStart=/usr/local/bin/run-app.sh

[Install]
WantedBy=multi-user.target
UNIT

systemctl enable nest-app.service

echo "=== ks %post end ==="
%end
