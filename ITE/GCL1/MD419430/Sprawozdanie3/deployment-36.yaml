apiVersion: apps/v1
kind: Deployment
metadata:
  name: md419430-nginx-deploy
  labels:
    app: md419430-nginx
spec:
  replicas: 36
  selector:
    matchLabels:
      app: md419430-nginx
      track: stable
  template:
    metadata:
      labels:
        app: md419430-nginx
        track: stable
        version: "v1"
    spec:
      containers:
        - name: md419430-nginx
          image: md419430-nginx:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 2
      maxSurge: 30%