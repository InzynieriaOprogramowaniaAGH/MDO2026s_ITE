---
- name: Ping all hosts
  hosts: all
  gather_facts: false
  tasks:
    - name: Ping
      ansible.builtin.ping:

- name: Copy inventory to endpoints
  hosts: Endpoints
  become: true
  tasks:
    - name: Copy inventory file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/inventory.ini"
        dest: /tmp/inventory.ini
        owner: ansible
        group: ansible
        mode: "0644"

- name: Ping again
  hosts: all
  gather_facts: false
  tasks:
    - name: Ping again
      ansible.builtin.ping:

- name: Update packages and restart services
  hosts: Endpoints
  become: true
  tasks:
    - name: Update and upgrade packages
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist

    - name: Ensure rng-tools is installed
      ansible.builtin.apt:
        name: rng-tools
        state: present

    - name: Restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted

    - name: Restart rng-tools (or rngd)
      ansible.builtin.service:
        name: rng-tools
        state: restarted
      register: rng_tools_restart
      failed_when: false

    - name: Fallback restart rngd
      ansible.builtin.service:
        name: rngd
        state: restarted
      when: rng_tools_restart.failed
