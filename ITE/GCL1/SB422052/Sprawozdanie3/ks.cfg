# Generated by Anaconda
# Keyboard layouts
keyboard --vckeymap=us --xlayouts='us'
# System language
lang en_US.UTF-8

# Zródło instalacji (wymóg z instrukcji dla aarch64)
url --mirrorlist=http://mirrors.fedoraproject.org/mirrorlist?repo=fedora-44&arch=aarch64
repo --name=update --mirrorlist=http://mirrors.fedoraproject.org/mirrorlist?repo=updates-released-f44&arch=aarch64

# Network information
network  --hostname=fedora-kick

# Zgoda na licencję i automatyczny restart po instalacji
eula --agreed
reboot

%packages
@^custom-environment
@guest-agents
@networkmanager-submodules
@standard
# Instalacja Dockera w Fedorze
moby-engine
%end

# System authorization information
authselect enable-feature with-fingerprint

# Wyłączenie kreatora pierwszego uruchomienia
firstboot --disable

# Generated using Blivet
ignoredisk --only-use=vda
autopart
# Wymuszamy formatowanie całego dysku za każdym razem (wymóg z instrukcji)
clearpart --all --initlabel

# System timezone
timezone Europe/Warsaw --utc

# Root password
rootpw --iscrypted --allow-ssh $y$j9T$IO1lzFjpqQGdLEo5Ozudubdy$puBNEitiqyvsA9j/7AKhT3eIiAy/y6sJof9MJSr53jA
user --groups=wheel --name=seb --password=$y$j9T$fg/sfkBYhTxt4rsbtny2cT5G$6UF8KJ5tAdgYu9izx76vSmVyOLnN4DDUW5s8pujeQ1C --iscrypted --gecos="seb"

# Magiczna sekcja poinstalacyjna
%post --log=/root/ks-post.log
# Włączamy Dockera, żeby startował z systemem
systemctl enable docker

# Tworzymy skrypt usługi, który przy pierwszym uruchomieniu odpali Twój kontener
cat <<EOF > /etc/systemd/system/moj-kontener.service
[Unit]
Description=Uruchomienie kontenera z aplikacja
After=docker.service
Requires=docker.service

[Service]
TimeoutStartSec=0
Restart=always
ExecStartPre=-/usr/bin/docker rm -f express-prod-app
ExecStart=/usr/bin/docker run --name express-prod-app -p 3000:3000 sebboze3/moj-express-bldr:latest

[Install]
WantedBy=multi-user.target
EOF

# Włączamy usługę aplikacji
systemctl enable moj-kontener.service
%end