apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-potega
spec:
  replicas: 3
  selector:
    matchLabels:
      app: super-nginx
  template:
    metadata:
      labels:
        app: super-nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
