apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-stable
  labels:
    app: web
    track: stable
spec:
  replicas: 4
  selector:
    matchLabels:
      app: web
      track: stable
  template:
    metadata:
      labels:
        app: web
        track: stable
    spec:
      containers:
        - name: web
          image: web-custom:v2
          ports:
            - containerPort: 80