apiVersion: apps/v1
kind: Deployment
metadata:
  name: profesjonalne-wdrozenie-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nestjs-super-apka
  template:
    metadata:
      labels:
        app: nestjs-super-apka
    spec:
      containers:
      - name: kontener-nestjs
        image: nestjs-projekt:v2
        imagePullPolicy: Never
        ports:
        - containerPort: 3000