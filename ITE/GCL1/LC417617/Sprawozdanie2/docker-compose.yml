version: '3.8'
networks:
  jenkins:
volumes:
  jenkins-data-v2:
  jenkins-docker-certs-v2:
services:
  jenkins-docker:
    image: docker:dind
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=/certs
    volumes:
      - jenkins-data-v2:/var/jenkins_home
      - jenkins-docker-certs-v2:/certs/client
    networks:
      jenkins:
        aliases:
          - docker
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    ports:
      - "8081:8080"
      - "50001:50000"
    environment:
      - DOCKER_HOST=tcp://docker:2376
      - DOCKER_CERT_PATH=/certs/client
      - DOCKER_TLS_VERIFY=1
    volumes:
      - jenkins-data-v2:/var/jenkins_home
      - jenkins-docker-certs-v2:/certs/client:ro
    networks:
      - jenkins
    depends_on:
      - jenkins-docker