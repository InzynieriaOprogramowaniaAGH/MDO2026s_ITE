apiVersion: apps/v1
kind: Deployment
metadata:
  name: lc417617-canary-stable
  labels:
    app: lc417617-canary
    version: stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: lc417617-canary
      version: stable
  template:
    metadata:
      labels:
        app: lc417617-canary
        version: stable
    spec:
      containers:
        - name: web
          image: lc417617-k8s-demo:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lc417617-canary-new
  labels:
    app: lc417617-canary
    version: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lc417617-canary
      version: canary
  template:
    metadata:
      labels:
        app: lc417617-canary
        version: canary
    spec:
      containers:
        - name: web
          image: lc417617-k8s-demo:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: lc417617-canary-service
  labels:
    app: lc417617-canary
spec:
  type: ClusterIP
  selector:
    app: lc417617-canary
  ports:
    - name: http
      port: 80
      targetPort: 80
