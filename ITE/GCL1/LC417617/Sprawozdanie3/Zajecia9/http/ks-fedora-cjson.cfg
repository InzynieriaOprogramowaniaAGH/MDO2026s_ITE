#version=F44

text
reboot

lang en_US.UTF-8
keyboard --xlayouts='pl'
timezone Europe/Warsaw --utc

network --bootproto=dhcp --device=link --activate --hostname=fedora-cjson-auto

url --mirrorlist=https://mirrors.fedoraproject.org/mirrorlist?repo=fedora-44&arch=x86_64
repo --name=updates --mirrorlist=https://mirrors.fedoraproject.org/mirrorlist?repo=updates-released-f44&arch=x86_64

rootpw --lock
user --name=deploy --groups=wheel --password=$6$FvNjKzZDknKSUdHm$TZ.xkc6r7FQ6YducdAwMRKhz0oFV8Yr5r.DGAI9atvBo6Ck3fjrI/MvEOg0hCYW5fEPnPye/4lRdNXuBFu0CP/ --iscrypted --gecos="Deploy User"

firewall --enabled --service=ssh
selinux --enforcing

zerombr
clearpart --all --initlabel
autopart --type=lvm

bootloader --location=mbr --timeout=1

services --enabled=sshd,docker

%packages
@core
openssh-server
moby-engine
curl
tar
ca-certificates
%end

%post --interpreter=/bin/bash --log=/root/ks-post.log

set -eux

mkdir -p /opt/cjson-demo

curl -fL http://172.26.247.103:8000/cjson-artifact.tar.gz -o /opt/cjson-demo/cjson-artifact.tar.gz
curl -fL http://172.26.247.103:8000/Dockerfile.runtime -o /opt/cjson-demo/Dockerfile

cat > /usr/local/sbin/cjson-firstboot.sh <<'EOF'
#!/bin/bash
set -eux

mkdir -p /var/lib/cjson-firstboot
cd /opt/cjson-demo

if [ ! -d /opt/cjson-demo/cjson-artifact ]; then
    tar -xzf /opt/cjson-demo/cjson-artifact.tar.gz -C /opt/cjson-demo
fi

for i in $(seq 1 30); do
    if docker info >/dev/null 2>&1; then
        break
    fi
    sleep 2
done

docker rm -f cjson-demo || true
docker rmi lc417617-cjson-deploy:s09 || true

docker build -t lc417617-cjson-deploy:s09 /opt/cjson-demo
docker run -d --name cjson-demo lc417617-cjson-deploy:s09

docker logs cjson-demo > /var/log/cjson-demo.log 2>&1 || true

touch /var/lib/cjson-firstboot/done
EOF

chmod +x /usr/local/sbin/cjson-firstboot.sh

cat > /etc/systemd/system/cjson-firstboot.service <<'EOF'
[Unit]
Description=Build and run cJSON artifact container after first boot
Wants=network-online.target
Requires=docker.service
After=network-online.target docker.service

[Service]
Type=oneshot
RemainAfterExit=yes
ExecStart=/usr/local/sbin/cjson-firstboot.sh

[Install]
WantedBy=multi-user.target
EOF

systemctl enable sshd.service
systemctl enable docker.service
systemctl enable cjson-firstboot.service

%end
