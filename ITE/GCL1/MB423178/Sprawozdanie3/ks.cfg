# Generated by Anaconda 44.30
# Keyboard layouts
keyboard --vckeymap=pl --xlayouts='pl'
# System language
lang pl_PL.UTF-8

# Network information
network  --hostname=fedora-petclinic

# Repositories Fedora 44 for Netinst
url --mirrorlist=http://mirrors.fedoraproject.org/mirrorlist?repo=fedora-44&arch=x86_64
repo --name=update --mirrorlist=http://mirrors.fedoraproject.org/mirrorlist?repo=updates-released-f44&arch=x86_64

%packages
@^custom-environment
# for Docker and Java
moby-engine
docker-compose
wget
%end

# Run the Setup Agent on first boot
firstboot --enable

# Generated using Blivet version 3.13.2
ignoredisk --only-use=sda
# Partition clearing information
zerombr
clearpart --all --initlabel
autopart

# System timezone
timezone Europe/Warsaw --utc

# Root password
rootpw --iscrypted --allow-ssh $y$j9T$xrk/C38fupZFAkYpJSxg5Lc8$nEAHzsBXFNxNQFqF5lf.G55D7.PYhHjbYtzBgQSqHr4
user --groups=wheel --name=miki13 --password=$y$j9T$v6kF4mQigZQbwFfjqUk2X5Is$Be0jY/Wv.rM1WSUJtxFHCXy9wFKIDwoSxnyCMk.CoN8 --iscrypted --gecos="Miki13"

# automatic restart after installation
reboot

# Post-installation script
%post --log=/root/ks-post.log
# 1. start and enable Docker
systemctl enable docker

# 2. Download the Spring Petclinic application JAR file from previous lab
wget http://172.17.76.210:8000/spring-petclinic.jar -O /usr/local/bin/spring-petclinic.jar

# 3. Create a systemd service to run the Spring Petclinic application in a Docker container
cat <<EOF > /etc/systemd/system/petclinic.service
[Unit]
Description=Uruchomienie PetClinic
After=docker.service
Requires=docker.service

[Service]
TimeoutStartSec=0
Restart=always
ExecStartPre=-/usr/bin/docker rm -f petclinic-app
ExecStart=/usr/bin/docker run --name petclinic-app -p 8080:8080 -v /usr/local/bin/spring-petclinic.jar:/app.jar eclipse-temurin:17-jre java -jar /app.jar

[Install]
WantedBy=multi-user.target
EOF

systemctl enable petclinic.service
%end