# Generated by Anaconda 44.30 
# Keyboard layouts
keyboard --vckeymap=pl --xlayouts='pl'
# System language
lang pl_PL.UTF-8

# Installation source
url --mirrorlist=http://mirrors.fedoraproject.org/mirrorlist?repo=fedora-44&arch=aarch64
repo --name=updates --mirrorlist=http://mirrors.fedoraproject.org/mirrorlist?repo=updates-released-f44&arch=aarch64

# Network
network --bootproto=dhcp --device=enp1s0 --ipv6=auto --activate
network --hostname=yehor-fedora


clearpart --all --initlabel
ignoredisk --only-use=vda
autopart --type=plain --fstype=ext4

# System timezone
timezone Europe/Warsaw --utc

# Root password
rootpw --iscrypted $y$j9T$.PXbgq.37bywPbFNbB8hLMOQ$7CDuPkl/1aezLmj3v/9FxxOHEpd4K.TarRdVG/jb2rD

# User
user --name=yehor --groups=wheel --password=changeme123 --gecos="Yehor"

# System authorization
authselect enable-feature with-fingerprint

# Text mode, no firstboot wizard
text
firstboot --disable

# SELinux and firewall
selinux --enforcing
firewall --enabled

# Reboot automatically after installation
reboot

%packages
@^server-product-environment
docker
docker-compose
curl
wget
git
%end

%post --log=/root/ks-post.log
# Enable Docker on boot
systemctl enable docker

# Systemd service to pull and start readme-aura container on first boot
cat > /etc/systemd/system/readme-aura.service << 'EOF'
[Unit]
Description=readme-aura container
After=docker.service network-online.target
Requires=docker.service

[Service]
Type=oneshot
RemainAfterExit=yes
ExecStart=/usr/bin/docker run --rm --name readme-aura-app node:20 npx readme-aura@canary --help

[Install]
WantedBy=multi-user.target
EOF

systemctl enable readme-aura.service

echo ">>> Post-install complete" >> /root/ks-post.log
%end
