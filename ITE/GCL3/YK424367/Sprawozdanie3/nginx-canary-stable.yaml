apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-canary-stable
  labels:
    app: nginx-canary
    track: stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-canary
      track: stable
  template:
    metadata:
      labels:
        app: nginx-canary
        track: stable
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-canary
spec:
  selector:
    app: nginx-canary
  ports:
    - port: 80
      targetPort: 80
