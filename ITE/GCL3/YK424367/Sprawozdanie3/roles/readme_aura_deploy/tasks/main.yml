- name: Sanity check - ping
  ansible.builtin.ping:
  ignore_errors: yes
  register: sanity_ping

- name: Sanity check - wolne miejsce na dysku
  ansible.builtin.shell: df -BM / | awk 'NR==2{print $4}'
  changed_when: false
  ignore_errors: yes
  register: sanity_disk

- name: Sanity check - raport
  ansible.builtin.debug:
    msg:
      - "Ping: {{ 'OK' if sanity_ping is not failed else 'FAILED (ignorowane)' }}"
      - "Wolne miejsce na /: {{ sanity_disk.stdout | default('nieznane') }}"


- name: Zainstaluj zależności apt dla Dockera
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes
  become: yes

- name: Utwórz katalog na klucze apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: yes

- name: Pobierz klucz GPG Dockera
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: false
  become: yes

- name: Pobierz architekturę dpkg (arm64 / amd64)
  ansible.builtin.command: dpkg --print-architecture
  changed_when: false
  register: dpkg_arch

- name: Dodaj repozytorium Docker apt
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
  become: yes

- name: Zainstaluj Docker CE
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
    update_cache: yes
  become: yes

- name: Uruchom i włącz usługę Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: yes
  become: yes

- name: Zweryfikuj, że Docker działa (docker info)
  ansible.builtin.shell: docker info
  changed_when: false
  become: yes
  register: docker_info_result

- name: Potwierdź wersję Dockera
  ansible.builtin.debug:
    msg: "{{ docker_info_result.stdout_lines | select('match', 'Server Version.*') | list }}"

- name: Utwórz katalog roboczy na maszynie docelowej
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: directory
    mode: '0755'
  become: yes

- name: Wyślij plik .tgz na maszynę docelową
  ansible.builtin.copy:
    src: "{{ local_artifact_path }}"
    dest: "{{ artifact_dir }}/{{ artifact_filename }}"
    mode: '0644'
  become: yes

- name: Uruchom readme-aura w kontenerze node:20
  ansible.builtin.shell: |
    docker run --rm \
      --name {{ container_name }} \
      -v {{ artifact_dir }}:/artifacts:ro \
      {{ node_image }} \
      sh -c "
        set -e
        mkdir /app && cd /app
        npm init -y
        npm install /artifacts/{{ artifact_filename }}
        npx readme-aura init --template PurpleGlow
        npx readme-aura build
      "
  become: yes
  register: run_result

- name: Zweryfikuj poprawne uruchomienie aplikacji
  ansible.builtin.assert:
    that:
      - run_result.rc == 0
    fail_msg: "Aplikacja zakończyła się błędem (rc={{ run_result.rc }})"
    success_msg: "Aplikacja uruchomiona poprawnie"

- name: Pokaż ostatnie linie wyjścia kontenera
  ansible.builtin.debug:
    msg: "{{ run_result.stdout_lines[-10:] }}"

- name: Usuń katalog z artefaktem z maszyny docelowej
  ansible.builtin.file:
    path: "{{ artifact_dir }}"
    state: absent
  become: yes

- name: Usuń pobrany obraz node:20 (opcjonalne, zwalnia miejsce)
  ansible.builtin.shell: docker rmi {{ node_image }} || true
  become: yes
  changed_when: false
