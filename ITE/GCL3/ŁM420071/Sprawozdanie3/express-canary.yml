
apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-prod
spec:
  replicas: 3 
  selector:
    matchLabels:
      app: express-canary-service
  template:
    metadata:
      labels:
        app: express-canary-service
        track: stable
    spec:
      containers:
      - name: express-container
        image: express-app:v2
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-canary
spec:
  replicas: 1 
  selector:
    matchLabels:
      app: express-canary-service
  template:
    metadata:
      labels:
        app: express-canary-service
        track: canary
    spec:
      containers:
      - name: express-container
        image: express-app:v3
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
---

apiVersion: v1
kind: Service
metadata:
  name: express-canary-balancer
spec:
  selector:
    app: express-canary-service 
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000