apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastify-production
spec:
  replicas: 4
  selector:
    matchLabels:
      app: fastify-main
  template:
    metadata:
      labels:
        app: fastify-main
        role: frontend
    spec:
      containers:
      - name: fastify-container
        image: moja-aplikacja:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
