eula --agreed

# Keyboard layouts
keyboard --vckeymap=pl --xlayouts='pl'
# System language
lang pl_PL.UTF-8

# Network
network --bootproto=dhcp --device=link --activate --hostname=fedora-qrcode-node

# Installation source (Fedora 40)
url --mirrorlist=http://mirrors.fedoraproject.org/mirrorlist?repo=fedora-40&arch=x86_64
repo --name=updates --mirrorlist=http://mirrors.fedoraproject.org/mirrorlist?repo=updates-released-f40&arch=x86_64

# Bootloader
bootloader --location=mbr --boot-drive=sda

# Disk - clearpart gwarantuje formatowanie przy każdej reinstalacji
ignoredisk --only-use=sda
clearpart --all --initlabel --drives=sda
autopart

# Timezone
timezone Europe/Warsaw --utc

# Passwords
rootpw --iscrypted $6$O82Krm6ei3tJkbm2$5Yon5sTjQZcZAp0arMf2nruHBpHmzOKXyMrAgE9PLoi6MgE66rhzeAd5PhLnsCwuQ9jh/GboN73v7dvaiFm2L0
user --name=spankey --groups=wheel --iscrypted --password=$6$z7OqUofzNAxIavCI$GGqfccHQD6vFrav.N5yj0oUmcNZDZPvZrQNSt29VFHtX8XPxPiA6AlzRjjfVW0Uga7TXEIgCxdpP4jE0R2RTU0

%packages
@^server-product-environment
@guest-agents
dotnet-sdk-8.0
wget
git
unzip
curl
%end

%post --log=/root/ks-post.log
set -x

JENKINS_URL="http://192.168.0.96:8080"
JOB_PATH="job/qrcode/lastSuccessfulBuild/artifact"

mkdir -p /opt/qrcode-app/{lib,output,src}

wget -q -O /opt/qrcode-app/lib/Genocs.QRCodeLibrary.nupkg \
    "${JENKINS_URL}/${JOB_PATH}/final_artifacts/Genocs.QRCodeLibrary.5.0.0.nupkg" \
    || echo "Failed to download .nupkg from Jenkins"

wget -q -O /opt/qrcode-app/output/qrcode-jenkins.bmp \
    "${JENKINS_URL}/${JOB_PATH}/TestProj/qrcode.bmp" \
    || echo "Failed to download qrcode.bmp from Jenkins"

unzip -q /opt/qrcode-app/lib/Genocs.QRCodeLibrary.nupkg \
    -d /opt/qrcode-app/lib/extracted 2>/dev/null || true

cd /opt/qrcode-app/src
dotnet new console -n QRRunner --force

cd /opt/qrcode-app/src/QRRunner
dotnet add package QRCoder --version 1.4.3

cat > /opt/qrcode-app/src/QRRunner/Program.cs << 'CSHARP'
using QRCoder;
using System.IO;
using System;

string url = "https://jenkins.io";
string outDir = "/opt/qrcode-app/output";
Directory.CreateDirectory(outDir);

var gen = new QRCodeGenerator();
var data = gen.CreateQrCode(url, QRCodeGenerator.ECCLevel.Q);
var qr = new BitmapByteQRCode(data);
byte[] bmpBytes = qr.GetGraphic(10);

string outFile = Path.Combine(outDir, $"qrcode_{DateTime.Now:yyyyMMdd_HHmmss}.bmp");
File.WriteAllBytes(outFile, bmpBytes);

Console.WriteLine($"QR code saved: {outFile}");
Console.WriteLine($"URL encoded: {url}");
CSHARP

dotnet publish /opt/qrcode-app/src/QRRunner \
    -c Release \
    -r linux-x64 \
    --self-contained true \
    -o /opt/qrcode-app/bin

cat > /etc/systemd/system/qrcode-generator.service << 'EOF'
[Unit]
Description=QR Code Generator (Genocs QRCodeLibrary demo)
After=network-online.target
Wants=network-online.target

[Service]
Type=oneshot
ExecStart=/opt/qrcode-app/bin/QRRunner
WorkingDirectory=/opt/qrcode-app
StandardOutput=journal
StandardError=journal
RemainAfterExit=yes

[Install]
WantedBy=multi-user.target
EOF

systemctl enable qrcode-generator.service
systemctl enable firewalld

chown -R spankey:spankey /opt/qrcode-app

echo "Post-install complete" >> /root/ks-post.log
%end

reboot