# Generated by Anaconda 44.30
# Keyboard layouts
keyboard --vckeymap=pl --xlayouts='pl'
# System language
lang pl_PL.UTF-8

url --mirrorlist=http://mirrors.fedoraproject.org/mirrorlist?repo=fedora-44&arch=x86_64
repo --name=updates --mirrorlist=http://mirrors.fedoraproject.org/mirrorlist?repo=updates-released-f44&arch=x86_64

%packages
@^minimal-environment
@container-management

%end

# Run the Setup Agent on first boot
#firstboot --enable
firstboot --disable

# Generated using Blivet version 3.13.2
ignoredisk --only-use=sda
autopart

bootloader --location=mbr --boot-drive=sda

network --hostname=fedora-local --bootproto=dhcp --device=link --activate

# Partition clearing information
#clearpart --none --initlabel
clearpart --all --initlabel --drives=sda

# System timezone
timezone Europe/Warsaw --utc

# Root password
rootpw --iscrypted --allow-ssh $y$j9T$uYIc/dnv0DogNnI9EUCYvG7Q$BOZtAIoDgM5ditiMn0jySkeeON2cjM4K5aCaXPdb8h4

%post --log=/root/kickstart-post.log

systemctl enable docker

docker pull blackcaer/express-app:latest

cat > /etc/systemd/system/express-app.service << 'EOF'
[Unit]
Description=Express.js Application
After=docker.service
Requires=docker.service

[Service]
Restart=always
ExecStartPre=-/usr/bin/docker rm -f express-app
ExecStart=/usr/bin/docker run --rm --name express-app -p 3000:3000 container_deploy_image
ExecStop=/usr/bin/docker stop express-app

[Install]
WantedBy=multi-user.target
EOF

systemctl daemon-reload
systemctl enable express-app.service

%end

reboot
