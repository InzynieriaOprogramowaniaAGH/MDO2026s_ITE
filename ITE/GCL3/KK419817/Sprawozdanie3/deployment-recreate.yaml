apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-recreate
spec:
  replicas: 8
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: express-recreate
      version: stable
  template:
    metadata:
      labels:
        app: express-recreate
        version: stable
    spec:
      containers:
      - name: express-app
        image: blackcaer/express-app:22
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: express-recreate-service
spec:
  type: NodePort
  selector:
    app: express-recreate
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30001
