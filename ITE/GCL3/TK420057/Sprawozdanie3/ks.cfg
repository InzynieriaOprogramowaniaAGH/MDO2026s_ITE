# Generated by Anaconda 44.30
text
reboot
# Keyboard layouts
keyboard --vckeymap=pl --xlayouts='pl'
# System language
lang pl_PL.UTF-8
url --mirrorlist=http://mirrors.fedoraproject.org/mirrorlist?repo=fedora-44&arch=x86_64
repo --name=updates --mirrorlist=http://mirrors.fedoraproject.org/mirrorlist?repo=updates-released-f44&arch=x86_64

%packages
@^server-product-environment
# Dependencje systemowe niezbędne do odtworzenia środowiska z Dockerfile
python3
python3-pip
git
%end

# System authorization information
authselect enable-feature with-fingerprint

# Run the Setup Agent on first boot
firstboot --enable

# Generated using Blivet version 3.13.2
ignoredisk --only-use=sda
autopart
# Partition clearing information (Wymóg: reinstalacja "w kółko")
clearpart --all --initlabel --drives=sda

network --bootproto=dhcp --device=link --activate --hostname=fedora-nienadzorowana
# System timezone
timezone Europe/Warsaw --utc

# Root password i użytkownik student
rootpw --iscrypted --allow-ssh $y$j9T$.CrWFhTrg/hQ4ApW36jobdwg$98gTpOVQk6sZFIV3TFsK47r/jmyNz.Ln1lUWDl3Y5O1
user --groups=wheel --name=student --password=$y$j9T$algnRZMLDblD6zqvsVUz2OHr$K5WyAn078ZbaJSOupT9geSOwCrZCOElCAvyD4mwp1M2 --iscrypted --gecos="student"

%post --log=/root/kickstart-post.log

mkdir -p /app
git clone -b main https://github.com/Chudybyk333/flask.git /app

cd /app

python3 -m pip install --upgrade pip
pip install build
python3 -m build

pip install dist/*.whl gunicorn

cat <<EOF > /etc/systemd/system/flaskapp.service
[Unit]
Description=Gunicorn service running Flask App from Pipeline
After=network.target

[Service]
User=root
WorkingDirectory=/app
ExecStart=/usr/local/bin/gunicorn --bind 0.0.0.0:5000 wsgi:app
Restart=always

[Install]
WantedBy=multi-user.target
EOF

systemctl daemon-reload
systemctl enable flaskapp.service

%end