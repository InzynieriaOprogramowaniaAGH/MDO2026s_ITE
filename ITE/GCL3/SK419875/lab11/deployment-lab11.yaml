apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab11-deploy
spec:
  replicas: 10
  selector:
    matchLabels:
      app: lab11-app
  template:
    metadata:
      labels:
        app: lab11-app
    spec:
      containers:
      - name: nginx-web
        image: nginx:alpine
        ports:
        - containerPort: 80
