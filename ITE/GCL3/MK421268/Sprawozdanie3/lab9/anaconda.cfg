# Generated by Anaconda 44.30
# Keyboard layouts
keyboard --vckeymap=us --xlayouts='us'
# System language
lang en_US.UTF-8

%packages
@^server-product-environment

%end

# System authorization information
authselect enable-feature with-fingerprint

# Run the Setup Agent on first boot
firstboot --enable

# Generated using Blivet version 3.13.2
ignoredisk --only-use=sda
# System bootloader configuration
bootloader --location=mbr --boot-drive=sda
autopart
# Partition clearing information
clearpart --all --initlabel

# System timezone
timezone Europe/Warsaw --utc

# Root password
rootpw --iscrypted --allow-ssh $y$j9T$4awbufzixMjN91wjn1sk3UhQ$CiTft1Kf13c/VhzU1PkW7uEXHd7tVFP/laOpJ57dr/3
user --groups=wheel --name=fedora --gecos="fedora"

reboot

%packages
@^server-product-environment
nodejs
wget
tar
%end

%post --log=/root/post-install.log
#zakres rozszerzony
exec < /dev/tty3 > /dev/tty3
chvt 3
echo ">>> POBIERANIE I INSTALACJA ARTEFAKTU Z PIPELINE <<<"

mkdir -p /opt/pipeline
cd /opt/pipeline

wget http://172.25.55.252:8080/express-5.2.1.tgz -O express-5.2.1.tgz
tar -xzf express-5.2.1.tgz

echo ">>> INSTALACJA ZALEZNOSCI NPM <<<"
cd package
npm install
npm install express

cat << 'EOF' > /usr/local/bin/start-moj-program.sh
#!/bin/bash
echo "Uruchamianie aplikacji z artefaktu"
cd /opt/pipeline/package
node -e "const express = require('express'); const app = express(); app.listen(3000, () => console.log('Aplikacja Express dziala na porcie 3000!')); setInterval(() => {}, 10000);"
EOF

chmod +x /usr/local/bin/start-moj-program.sh

cat << 'EOF' > /etc/systemd/system/pipeline-app.service
[Unit]
Description=Automatyczny start paczki z labow
After=network.target

[Service]
Type=simple
ExecStart=/usr/local/bin/start-moj-program.sh
Restart=always

[Install]
WantedBy=multi-user.target
EOF

systemctl enable pipeline-app.service

echo ">>> ZAKONCZONO KONFIGURACJE. RESTART SYSTEMU <<<"
sleep 5
chvt 1
%end