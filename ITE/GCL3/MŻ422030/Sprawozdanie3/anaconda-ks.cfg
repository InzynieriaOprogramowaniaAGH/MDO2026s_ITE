# Generated by Anaconda 44.30

# Keyboard and language
keyboard --vckeymap=pl --xlayouts='pl'
lang pl_PL.UTF-8

# Timezone
timezone Europe/Warsaw --utc

# Network
network --bootproto=dhcp --device=link --activate
network --hostname=fedora-minimalpy

# Installation source
url --mirrorlist=https://mirrors.fedoraproject.org/mirrorlist?repo=fedora-44&arch=x86_64
repo --name=updates --mirrorlist=https://mirrors.fedoraproject.org/mirrorlist?repo=updates-released-f44&arch=x86_64

# Disk format
ignoredisk --only-use=sda
clearpart --all --initlabel --drives=sda
autopart

# Root password
rootpw --iscrypted --allow-ssh $y$j9T$szr07KUzsf4WJo0WmHtgv1MU$B6LWqddC7osdwVnQ7gHtCHYGcRM2mIpRrid1l16

# User
user --name=mz422030 --password=password --plaintext --groups=wheel

# No firstboot
firstboot --disable

# SELinux
selinux --enforcing

# Firewall
firewall --enabled --service=ssh

# Reboot automatically
reboot

%packages
@^server-product-environment
@container-management
@guest-agents
curl
wget
%end

%post --log=/root/ks-post.log
# Włącz i uruchom Docker
systemctl enable docker

# Serwis uruchomia kontener
cat > /etc/systemd/system/minimalpy.service << 'EOF'
[Unit]
Description=minimalpy container
After=docker.service network-online.target
Requires=docker.service

[Service]
Restart=always
ExecStartPre=-/usr/bin/docker rm -f minimalpy_app
ExecStart=/usr/bin/docker run --name minimalpy_app -p 5430:5430 mystackoverflown/minimalpy:latest
ExecStop=/usr/bin/docker stop minimalpy_app

[Install]
WantedBy=multi-user.target
EOF

systemctl enable minimalpy.service
%end