apiVersion: apps/v1
kind: Deployment
metadata:
  name: minimalpy-deployment
  labels:
    app: minimalpy
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: minimalpy
  template:
    metadata:
      labels:
        app: minimalpy
    spec:
      containers:
      - name: minimalpy-container
        image: mystackoverflown/minimalpy:v2
        imagePullPolicy: Never
        ports:
        - containerPort: 5430
