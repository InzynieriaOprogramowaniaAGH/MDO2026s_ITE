apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-canary-pod
  template:
    metadata:
      labels:
       app: flask-app
       role: frontend
    spec:
      containers:
      - name: flask-container
        image: moja-aplikacja:v2
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
