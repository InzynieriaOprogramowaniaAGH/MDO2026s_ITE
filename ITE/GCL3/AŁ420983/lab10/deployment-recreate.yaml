apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-recreate
  labels:
    app: flask-app
spec:
  replicas: 4
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: flask-app-recreate
  template:
    metadata:
      labels:
        app: flask-app-recreate
    spec:
      containers:
      - name: flask-container
        image: moja-aplikacja:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
