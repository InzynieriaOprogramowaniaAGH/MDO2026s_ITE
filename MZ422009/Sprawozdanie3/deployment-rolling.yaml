apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab10-app
  labels:
    app: lab10-app
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 2
      maxSurge: 30%
  selector:
    matchLabels:
      app: lab10-app
  template:
    metadata:
      labels:
        app: lab10-app
    spec:
      containers:
      - name: lab10-nginx
        image: lab10-nginx:v2
        imagePullPolicy: Never
        ports:
        - containerPort: 80
