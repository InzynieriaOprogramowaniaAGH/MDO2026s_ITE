# Generated by Anaconda 44.30
text
reboot

# Keyboard layouts
keyboard --vckeymap=pl --xlayouts='pl'
# System language
lang pl_PL.UTF-8


url --mirrorlist=http://mirrors.fedoraproject.org/mirrorlist?repo=fedora-44&arch=x86_64
repo --name=updates --mirrorlist=http://mirrors.fedoraproject.org/mirrorlist?repo=updates-released-f44&arch=x86_64

network --bootproto=dhcp --device=link --activate --hostname=fedora-lab9-auto

# System authorization information
authselect enable-feature with-fingerprint

# Run the Setup Agent on first boot
firstboot --disable

# Generated using Blivet version 3.13.2
ignoredisk --only-use=sda

# Partition clearing information
zerombr
clearpart --all --initlabel
autopart --type=lvm

# System timezone
timezone Europe/Warsaw --utc

#Root password
rootpw haslomaslo321 --plaintext
user --groups=wheel --name=milosz --password=haslomaslo321 --plaintext

bootloader --location=mbr
selinux --enforcing
firewall --enabled --ssh

%packages
@^server-product-environment
docker
%end

%post --log=/root/post-install.log
systemctl enable docker

cat > /etc/systemd/system/express-app.service <<'EOF'
[Unit]
Description=Express Docker App
After=docker.service
Requires=docker.service

[Service]
Restart=always
ExecStartPre=-/usr/bin/docker rm -f express-app
ExecStartPre=/usr/bin/docker pull zucho/express-deploy:latest
ExecStart=/usr/bin/docker run --name express-app zucho/express-deploy:latest
ExecStop=/usr/bin/docker stop express-app

[Install]
WantedBy=multi-user.target
EOF

systemctl enable express-app.service
%end
